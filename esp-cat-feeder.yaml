# =============================================================================
# ESP Cat Feeder
# Continuous-rotation servo feeder (SG90 360)
# =============================================================================
# IMPORTANT: this is a 360-degree CONTINUOUS servo, not a positional one.
# A continuous servo has no angle - the pulse width sets SPEED and DIRECTION:
#
#   0.6 ms  (level -1.0) = full reverse
#   1.5 ms  (level  0.0) = STOP            <- must be exactly this to sit still
#   2.4 ms  (level +1.0) = full forward
#
# So everything is timed, like the original "2 second sweep":
#
#   Run Speed            forward speed in %  (lower = slower movement)
#   Open Time per Cycle  how long it drives forward, ms  <- portion size
#   Backoff Speed        reverse speed in %  (the "ease back" at the end)
#   Backoff Time         how long it reverses, ms
#   Cycles per Feed      how many forward/back pulses make one portion
#   Neutral Trim         stop-point correction in % (0 = 1.5 ms)
#   Max Feeds per Day    0 = unlimited
#   Cat Detect Distance  ultrasonic trigger threshold (cm)
#   Cooldown             minimum gap between automatic feeds (s)
#
# "Revolutions" = speed x time. At 100% an SG90 360 does roughly 1 turn per
# second, so 60% for 1200 ms is about 0.7 turn per cycle.
# =============================================================================

substitutions:
  devicename: "esp-cat-feeder"
  upper_devicename: "ESP Cat Feeder"
  servo_pin: GPIO13
  ultrasonic_trigger_pin: GPIO23
  ultrasonic_en_pin: GPIO22

  # --- Local settings ---------------------------------------------------------
  # WiFi credentials stay in secrets.yaml (wifi_ssid / wifi_ssid2 /
  # wifi_password), never in this file. Keep secrets.yaml private.
  #
  #   timezone   IANA name of YOUR zone, e.g. "Europe/London",
  #              "America/New_York", "Australia/Sydney".
  #              The feed schedule runs on local time, so a wrong value here
  #              shifts every scheduled feed. "Etc/UTC" is a neutral default,
  #              not a suggestion.
  timezone: "Etc/UTC"

esphome:
  name: $devicename
  friendly_name: $upper_devicename

  on_boot:
    priority: -100
    then:
      # Neutral = stopped. Never send a driving pulse at boot, or a 360
      # servo will spin forever.
      - servo.write:
          id: gate_servo
          level: !lambda 'return id(neutral_trim).state / 100.0f;'
      - logger.log: "Boot: servo at neutral (stopped)"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO
  # Set to 115200 for logs
  baud_rate: 0

wifi:
  networks:
    # Static IP belongs to the home network only. The second network
    # (hotspot / backup) uses DHCP so it is not unreachable.
    - ssid: !secret wifi_ssid
      password: !secret wifi_password

  # Fallback hotspot, used only when network is reachable.
  ap:
    ssid: $devicename
    password: !secret wifi_password

captive_portal:

web_server:
  port: 80
  version: 2
  # Native OTA only. captive_portal would otherwise also expose OTA over HTTP.
  ota: false

api:
  # No encryption key = plaintext API. Do NOT leave an empty
  # "encryption:" key here; it links against the encrypted frame helper
  # and fails with an undefined APIPlaintextFrameHelper vtable.
  reboot_timeout: 0s

ota:
  - platform: esphome

# --- Servo -------------------------------------------------------------------
output:
  - platform: ledc
    pin: $servo_pin
    id: servo_pwm
    frequency: 50Hz

servo:
  - id: gate_servo
    output: servo_pwm
    min_level: 3%          # 0.6 ms = full reverse
    max_level: 12%         # 2.4 ms = full forward
    idle_level: 7.5%       # 1.5 ms = stop (startup position)
    transition_length: 0ms
    # No auto_detach_time: keep the neutral pulse applied so the servo holds
    # still instead of coasting.

# --- Time / daily counter ----------------------------------------------------
time:
  - platform: sntp
    id: sntp_time
    # Timezone for the midnight reset. ESPHome can infer this from the build
    # machine, but setting it explicitly is safer.
    timezone: "${timezone}"
    # Fires on every successful sync, including the manual "Sync Time Now".
    on_time_sync:
      - lambda: |-
          ESPTime t = id(sntp_time).now();
          ESP_LOGI("feeder", "NTP time synced: %04d-%02d-%02d %02d:%02d:%02d",
                   t.year, t.month, t.day_of_month, t.hour, t.minute, t.second);
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              id(feed_count) = 0;
              id(last_feed_day) = id(sntp_time).now().day_of_year;
          - logger.log: "Midnight: feed counter reset"

# --- Scheduled feeding start time --------------------------------------------
# The schedule fires at this time of day, then every "Feed Every (hours)".
datetime:
  - platform: template
    type: time
    name: "First Feed At"
    id: first_feed_at
    entity_category: config
    icon: mdi:clock-start
    optimistic: true
    restore_value: true
    initial_value: "07:00:00"

globals:
  - id: feed_count
    type: int
    restore_value: yes
    initial_value: '0'

  # Day-of-year of the last counted feed, used to catch a missed midnight
  # reset while the device was offline.
  - id: last_feed_day
    type: int
    restore_value: yes
    initial_value: '0'

  # Cycle counter for the feed loop. ESPHome's "repeat" injects an "iteration"
  # argument into every action below it, so a repeat nested inside a repeat
  # declares "iteration" twice and will not compile. "while" does not inject it,
  # so the outer cycle loop counts with this global instead and the inner
  # repeats can use their own "iteration" safely.
  - id: cycle_i
    type: int
    restore_value: no
    initial_value: '0'

  # Unix timestamp (seconds) of the last *scheduled* feed. Restored across
  # reboots so the interval keeps running. 0 = not initialised yet.
  - id: last_auto_feed
    type: int
    restore_value: yes
    initial_value: '0'

  # Timestamp of the schedule slot currently due (recomputed every minute).
  - id: due_grid
    type: int
    restore_value: no
    initial_value: '0'

  # Next scheduled slot = due_grid + one interval (recomputed every minute).
  - id: next_grid
    type: int
    restore_value: no
    initial_value: '0'

  # Unix timestamp of the last successful feed of ANY kind (manual / motion /
  # scheduled). Restored across reboots. 0 = never fed.
  - id: last_feed_ts
    type: int
    restore_value: yes
    initial_value: '0'

# --- Tunable feeding parameters ---------------------------------------------
number:
  # Stop point. A continuous servo should sit dead still at 1.5 ms (level 0).
  # If it keeps creeping, trim this in 1% steps until it stops.
  - platform: template
    name: "Neutral Trim"
    id: neutral_trim
    entity_category: config
    icon: mdi:circle-slice-8
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: -20
    max_value: 20
    step: 1
    unit_of_measurement: "%"
    mode: box

  # Forward speed. Lower = slower movement.
  - platform: template
    name: "Run Speed"
    id: run_speed
    entity_category: config
    icon: mdi:speedometer
    optimistic: true
    restore_value: true
    initial_value: 60
    min_value: 10
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    mode: box

  # Reverse speed for the ease-back at the end of each cycle.
  - platform: template
    name: "Backoff Speed"
    id: backoff_speed
    entity_category: config
    icon: mdi:undo-variant
    optimistic: true
    restore_value: true
    initial_value: 50
    min_value: 10
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    mode: box

  - platform: template
    name: "Open Time per Cycle"
    id: open_time
    entity_category: config
    icon: mdi:timer-sand
    optimistic: true
    restore_value: true
    initial_value: 1200
    min_value: 50
    max_value: 5000
    step: 50
    unit_of_measurement: ms
    mode: box

  - platform: template
    name: "Backoff Time"
    id: backoff_time
    entity_category: config
    icon: mdi:timer-undo-outline
    optimistic: true
    restore_value: true
    initial_value: 400
    min_value: 0
    max_value: 3000
    step: 50
    unit_of_measurement: ms
    mode: box

  - platform: template
    name: "Cycles per Feed"
    id: cycles_per_feed
    entity_category: config
    icon: mdi:rotate-right
    optimistic: true
    restore_value: true
    initial_value: 2
    min_value: 1
    max_value: 20
    step: 1
    mode: box

  - platform: template
    name: "Max Feeds per Day"
    id: max_feeds
    entity_category: config
    icon: mdi:counter
    optimistic: true
    restore_value: true
    initial_value: 3
    min_value: 0
    max_value: 50
    step: 1
    mode: box

  - platform: template
    name: "Cat Detect Distance"
    id: detect_distance
    entity_category: config
    icon: mdi:ruler
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 3
    max_value: 100
    step: 1
    unit_of_measurement: cm
    mode: box

  - platform: template
    name: "Cooldown"
    id: cooldown_s
    entity_category: config
    icon: mdi:timer-lock-outline
    optimistic: true
    restore_value: true
    initial_value: 360
    min_value: 5
    max_value: 3600
    step: 5
    unit_of_measurement: s
    mode: box

  # How often the scheduled feeder runs. Only used when "Scheduled Feeding"
  # is on; the daily cap still applies.
  - platform: template
    name: "Feed Every (hours)"
    id: feed_interval_h
    entity_category: config
    icon: mdi:calendar-clock
    optimistic: true
    restore_value: true
    initial_value: 6
    min_value: 1
    max_value: 24
    step: 1
    unit_of_measurement: h
    mode: box

  # Raw calibration tool: drives the LEDC output directly in microseconds,
  # bypassing the servo component. For a continuous servo, use it to find the
  # pulse where the horn actually stops, then set Neutral Trim:
  #    trim % = (stop_pulse_us - 1500) / 9
  # (1% trim = 9 us, because 0.6-2.4 ms spans the -100..+100 level range.)
  - platform: template
    name: "Servo Test Pulse"
    id: servo_pulse
    icon: mdi:sine-wave
    entity_category: diagnostic
    min_value: 500
    max_value: 2500
    step: 10
    unit_of_measurement: us
    mode: slider
    set_action:
      - lambda: |-
          // 50 Hz = 20 ms period, so duty fraction = pulse width / 20000 us.
          id(servo_pwm).set_level(x / 20000.0f);
          ESP_LOGI("feeder", "Test pulse %.0f us (%.2f%%)", x, x / 200.0f);
      # NOTE: this moves the horn directly. Press "Test Gate" afterwards to
      # put the servo component back in sync before feeding. A 360-degree
      # continuous servo will just spin at a speed set by this pulse.

# --- Lock --------------------------------------------------------------------
switch:
  - platform: template
    name: "System Lock"
    id: system_lock
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:lock

  # Ultrasonic-triggered feeding on/off.
  - platform: template
    name: "Motion Trigger Feeding"
    id: detect_feed_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: mdi:motion-sensor

  # Timed feeding on/off.
  - platform: template
    name: "Scheduled Feeding"
    id: schedule_feed_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:calendar-clock

# --- Sensors -----------------------------------------------------------------
sensor:
  - platform: ultrasonic
    trigger_pin: $ultrasonic_trigger_pin
    echo_pin: $ultrasonic_en_pin
    id: bowl_distance
    name: "Bowl Distance"
    entity_category: diagnostic
    icon: mdi:ruler
    update_interval: 1s
    timeout: 1m
    filters:
      - median:
          window_size: 5
          send_every: 2
          send_first_at: 1
    on_value:
      # Tunable "cat is here" threshold, in cm, from Home Assistant / web UI.
      - if:
          condition:
            lambda: 'return id(bowl_distance).state < (id(detect_distance).state / 100.0f);'
          then:
            - if:
                condition:
                  and:
                    - switch.is_on: detect_feed_enabled
                    - switch.is_off: system_lock
                    - not:
                        script.is_running: cooldown
                then:
                  - logger.log: "Cat detected - feeding"
                  - script.execute: dispense
                else:
                  - logger.log:
                      format: "Trigger ignored (detect off / locked / cooling down)"
                      level: DEBUG

  - platform: template
    name: "Feeds Today"
    id: feeds_today
    icon: mdi:cat
    update_interval: 10s
    accuracy_decimals: 0
    state_class: total_increasing
    lambda: 'return id(feed_count);'

# --- Time / schedule display -------------------------------------------------
# Read-only views of the clock and the feed schedule. Plain text sensors so
# Home Assistant shows readable strings instead of epoch numbers.
text_sensor:
  # Proves the on-board clock is right. Shows "waiting for NTP" until the
  # first successful sync.
  - platform: template
    name: "Current Time"
    id: current_time
    entity_category: diagnostic
    icon: mdi:clock-outline
    update_interval: 10s
    lambda: |-
      ESPTime t = id(sntp_time).now();
      if (!t.is_valid()) {
        return std::string("waiting for NTP");
      }
      return t.strftime("%Y-%m-%d %H:%M:%S");

  # When the last feed of any kind happened. Polled, so the wording rolls over
  # from "Today" to "Yesterday" on its own at midnight.
  - platform: template
    name: "Last Feed"
    id: last_feed
    icon: mdi:history
    update_interval: 60s
    lambda: |-
      if (id(last_feed_ts) == 0) {
        return std::string("Never");
      }
      ESPTime feed = ESPTime::from_epoch_local((time_t) id(last_feed_ts));
      ESPTime now = id(sntp_time).now();
      if (now.is_valid()) {
        if (feed.day_of_year == now.day_of_year && feed.year == now.year) {
          return std::string("Today ") + feed.strftime("%H:%M");
        }
        ESPTime yesterday = ESPTime::from_epoch_local((time_t) (now.timestamp - 86400));
        if (feed.day_of_year == yesterday.day_of_year && feed.year == yesterday.year) {
          return std::string("Yesterday ") + feed.strftime("%H:%M");
        }
      }
      return feed.strftime("%d %b %H:%M");

  # Next slot on the schedule, mirroring what the scheduler will actually do:
  # a disabled schedule reads "Off" and a locked feeder appends "(locked)".
  - platform: template
    name: "Next Feed"
    id: next_feed
    icon: mdi:calendar-arrow-right
    update_interval: 60s
    lambda: |-
      if (!id(schedule_feed_enabled).state) {
        return std::string("Off");
      }
      if (id(next_grid) == 0) {
        return std::string("waiting for NTP");
      }
      ESPTime next = ESPTime::from_epoch_local((time_t) id(next_grid));
      std::string out = next.strftime("%a %H:%M");
      if (id(system_lock).state) {
        out += " (locked)";
      }
      return out;

# --- Buttons -----------------------------------------------------------------
button:
  - platform: template
    name: "Manual Feed"
    icon: mdi:hand-pointing-right
    # Bypasses the lock and the cooldown, but still respects Max Feeds per Day.
    on_press:
      - script.execute: dispense

  - platform: template
    name: "Sync Time Now"
    icon: mdi:clock-check
    # There is no native SNTP resync action, and SNTPComponent::update() is
    # compiled out on ESP32. Re-running setup() stops and re-inits SNTP, which
    # polls the servers immediately instead of waiting for the hourly refresh.
    on_press:
      - logger.log: "Manual time sync requested"
      - lambda: 'id(sntp_time).setup();'

  - platform: template
    name: "Test Gate"
    icon: mdi:gate-arrow-right
    entity_category: diagnostic
    # One forward / ease-back / stop pulse, exactly like a real feed cycle.
    # Does not count as a feed and does not touch the cooldown.
    on_press:
      - servo.write:
          id: gate_servo
          level: !lambda |-
            float lvl = (id(neutral_trim).state + id(run_speed).state) / 100.0f;
            return lvl > 1.0f ? 1.0f : lvl;
      - delay: !lambda 'return (uint32_t) id(open_time).state;'
      - servo.write:
          id: gate_servo
          level: !lambda |-
            float lvl = (id(neutral_trim).state - id(backoff_speed).state) / 100.0f;
            return lvl < -1.0f ? -1.0f : lvl;
      - delay: !lambda 'return (uint32_t) id(backoff_time).state;'
      - servo.write:
          id: gate_servo
          level: !lambda 'return id(neutral_trim).state / 100.0f;'
      - logger.log: "Test cycle done"

  - platform: template
    name: "Reset Feed Counter"
    icon: mdi:counter
    entity_category: diagnostic
    on_press:
      - globals.set:
          id: feed_count
          value: '0'
      - logger.log: "Feed counter manually reset"

# --- Scheduled feeding -------------------------------------------------------
# Fires at "First Feed At", then every "Feed Every (hours)" after that, e.g.
#   07:00 -> 13:00 -> 19:00 -> 01:00
# It works out which clock slot is currently due, so the times stay fixed
# instead of drifting with every reboot.
interval:
  - interval: 60s
    then:
      - if:
          condition:
            lambda: |-
              ESPTime now = id(sntp_time).now();
              if (!now.is_valid()) {
                return false;
              }
              const int32_t interval_s = (int32_t) (id(feed_interval_h).state * 3600.0f);
              if (interval_s <= 0) {
                return false;
              }
              const int32_t now_s = now.hour * 3600 + now.minute * 60 + now.second;
              const int32_t midnight = (int32_t) now.timestamp - now_s;
              const int32_t start_s = id(first_feed_at).hour * 3600 +
                                      id(first_feed_at).minute * 60 +
                                      id(first_feed_at).second;
              // Most recent slot at or before now, which may be yesterday.
              // C division truncates toward zero, so negative "since" needs an
              // extra step down to get a floor: without it, a time before
              // "First Feed At" resolves to a slot in the FUTURE.
              const int32_t since = now_s - start_s;
              int32_t k = since / interval_s;
              if (since < 0 && since % interval_s != 0) {
                k -= 1;
              }
              id(due_grid) = midnight + start_s + k * interval_s;
              // Slot after the one currently due, for the "Next Feed" readout.
              id(next_grid) = id(due_grid) + interval_s;
              // First valid time after boot: seed the slot, do not feed.
              if (id(last_auto_feed) == 0) {
                id(last_auto_feed) = id(due_grid);
                return false;
              }
              return id(due_grid) > id(last_auto_feed);
          then:
            - if:
                condition:
                  and:
                    - switch.is_on: schedule_feed_enabled
                    - switch.is_off: system_lock
                    - not:
                        script.is_running: cooldown
                then:
                  - globals.set:
                      id: last_auto_feed
                      value: !lambda 'return id(due_grid);'
                  - logger.log: "Scheduled feed"
                  - script.execute: dispense
                else:
                  - logger.log:
                      format: "Scheduled feed due, skipped (disabled / locked / cooling down)"
                      level: DEBUG

# --- Core logic --------------------------------------------------------------
script:
  - id: dispense
    mode: single          # double taps / repeated triggers are ignored
    then:
      # Roll the counter over if midnight was missed (device was offline).
      - lambda: |-
          ESPTime now = id(sntp_time).now();
          if (now.is_valid() && id(last_feed_day) != now.day_of_year) {
            id(last_feed_day) = now.day_of_year;
            id(feed_count) = 0;
            ESP_LOGI("feeder", "New day detected - counter reset");
          }

      # Daily cap. 0 means unlimited.
      - if:
          condition:
            lambda: |-
              const int cap = (int) id(max_feeds).state;
              return cap > 0 && id(feed_count) >= cap;
          then:
            - lambda: |-
                ESP_LOGW("feeder", "Feed blocked: daily limit %d reached (%d today)",
                         (int) id(max_feeds).state, id(feed_count));
          else:
            - script.execute: cooldown
            - lambda: |-
                ESP_LOGI("feeder", "Dispensing %d cycle(s): %d%% forward for %d ms, then %d%% reverse for %d ms",
                         (int) id(cycles_per_feed).state,
                         (int) id(run_speed).state, (int) id(open_time).state,
                         (int) id(backoff_speed).state, (int) id(backoff_time).state);
            - globals.set:
                id: cycle_i
                value: '0'

            - while:
                condition:
                  lambda: 'return id(cycle_i) < (int) id(cycles_per_feed).state;'
                then:
                  # 1. Drive forward for Open Time per Cycle.
                  - servo.write:
                      id: gate_servo
                      level: !lambda |-
                        float lvl = (id(neutral_trim).state + id(run_speed).state) / 100.0f;
                        return lvl > 1.0f ? 1.0f : lvl;
                  - delay: !lambda 'return (uint32_t) id(open_time).state;'

                  # 2. Ease back: reverse for Backoff Time.
                  - servo.write:
                      id: gate_servo
                      level: !lambda |-
                        float lvl = (id(neutral_trim).state - id(backoff_speed).state) / 100.0f;
                        return lvl < -1.0f ? -1.0f : lvl;
                  - delay: !lambda 'return (uint32_t) id(backoff_time).state;'

                  # 3. Stop and let it settle.
                  - servo.write:
                      id: gate_servo
                      level: !lambda 'return id(neutral_trim).state / 100.0f;'
                  - delay: 300ms

                  # Next cycle.
                  - lambda: 'id(cycle_i) += 1;'

            - globals.set:
                id: feed_count
                value: !lambda 'return id(feed_count) + 1;'
            - lambda: |-
                ESPTime t = id(sntp_time).now();
                if (t.is_valid()) {
                  id(last_feed_ts) = (int32_t) t.timestamp;
                }
                ESP_LOGI("feeder", "Feed done - %d today", id(feed_count));

  # "Occupied" flag: blocks the ultrasonic from triggering while it runs.
  - id: cooldown
    mode: restart
    then:
      - delay: !lambda 'return (uint32_t)(id(cooldown_s).state * 1000.0f);'
